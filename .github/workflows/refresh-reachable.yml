name: Refresh reachable nodes

on:
  schedule:
    - cron: '17 6 * * 1,4'  # Mon & Thu, 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh reachable-data.js
        run: ./refresh-reachable.sh

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reachable-data.js
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "refresh reachable-data.js"
          git push
