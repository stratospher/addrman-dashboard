name: Refresh tor exits

on:
  schedule:
    - cron: '23 6 * * 1,4'  # Mon & Thu, 06:23 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh tor-exit-data.js
        run: ./refresh-tor-exits.sh

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tor-exit-data.js tor-exit-history-data.js
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "refresh tor-exit-data.js"
          git push
